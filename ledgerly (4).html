<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
:root{--ink:#20271e;--muted:#7c8376;--line:#e9e9df;--paper:#fffefa;--bg:#f7f8f1;--green:#d7f16b;--deep:#31452c;--mint:#e9f2dd;--orange:#f6b872;--red:#db6f5b;--shadow:0 12px 35px #27351c0e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:76px;background:#fffefa;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 4.5%;gap:34px;position:sticky;top:0;z-index:4}.brand{display:flex;align-items:center;gap:10px;font:800 19px Manrope,sans-serif;letter-spacing:-.6px;min-width:205px}.logo{width:34px;height:34px;background:var(--green);border-radius:11px;display:grid;place-items:center;font-size:18px}.nav{display:flex;align-items:center;gap:5px;flex:1}.nav button{border:0;background:none;color:#777d72;padding:11px 12px;border-radius:10px;font-size:13px;font-weight:600}.nav button:hover,.nav button.active{background:#f1f3e8;color:var(--ink)}.topright{display:flex;gap:15px;align-items:center}.search{position:relative}.search input{width:185px;border:1px solid var(--line);background:#fbfbf6;padding:10px 12px 10px 34px;border-radius:10px;outline:none}.search span{position:absolute;left:12px;top:9px;color:#8c9285}.avatar{height:36px;width:36px;border-radius:50%;background:#e5eed6;display:grid;place-items:center;font-weight:700;color:var(--deep)}main{max-width:1440px;margin:auto;padding:35px 4.5% 70px}.heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:25px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;color:#8a9281;font-size:10px;font-weight:700;margin:0 0 8px}.heading h1{font:800 30px Manrope;margin:0;letter-spacing:-1.2px}.sub{color:var(--muted);margin:8px 0 0}.btn{border:1px solid var(--line);background:white;padding:10px 14px;border-radius:10px;color:var(--ink);font-weight:650;display:inline-flex;align-items:center;gap:7px}.btn:hover{background:#f7f8ef}.btn.primary{border-color:var(--green);background:var(--green)}.btn.dark{background:var(--deep);border-color:var(--deep);color:#fff}.btn.small{padding:7px 10px;font-size:12px}.actions{display:flex;gap:9px}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.metric{padding:20px 21px;position:relative;overflow:hidden}.metric .label{font-size:12px;color:var(--muted);font-weight:600}.metric .value{font:800 27px Manrope;letter-spacing:-1px;margin:12px 0 5px}.metric .foot{color:#8d9488;font-size:11px}.bubble{position:absolute;right:19px;top:19px;height:34px;width:34px;background:#f0f4e6;border-radius:11px;display:grid;place-items:center}.cols{grid-template-columns:1.5fr 1fr}.panel{padding:21px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.panel h2{font:750 16px Manrope;margin:0}.link{color:#576f43;font-weight:700;font-size:12px;border:0;background:none}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:15px;text-align:left}.quick button:hover{border-color:#bfd977;background:#fbfdec}.quick b{display:block;margin:9px 0 4px}.quick small{color:var(--muted)}.quick .ico{background:#f1f4e7;border-radius:9px;width:31px;height:31px;display:grid;place-items:center}.chart{height:198px;display:flex;align-items:end;gap:14px;padding:8px 5px 0;border-bottom:1px solid var(--line)}.barcol{height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px;flex:1}.bar{width:70%;border-radius:7px 7px 2px 2px;background:#d9ed96;min-height:4px;position:relative}.bar.current{background:#758e4f}.barcol label{font-size:10px;color:#969b8f;padding-bottom:9px}.activity{display:flex;flex-direction:column}.row{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0e8;gap:11px}.row:last-child{border-bottom:0}.docicon{width:34px;height:34px;border-radius:10px;background:#f0f4e6;display:grid;place-items:center}.grow{flex:1;min-width:0}.grow b{display:block;font-size:12px}.grow small{color:var(--muted);font-size:11px}.money{font-weight:700;font-size:12px}.badge{display:inline-flex;align-items:center;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:700;white-space:nowrap;background:#eff1eb;color:#687164}.badge.paid,.badge.accepted{background:#e8f3db;color:#54743a}.badge.sent,.badge.draft{background:#f3f0df;color:#827435}.badge.overdue,.badge.rejected{background:#fbe8e3;color:#a64e3c}.badge.partial{background:#e8eefc;color:#526eaa}.section{display:none}.section.show{display:block}.toolbar{display:flex;gap:10px;justify-content:space-between;margin-bottom:14px}.filters{display:flex;gap:8px}.filters input,.filters select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;outline:none}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:740px}.table th{text-align:left;text-transform:uppercase;letter-spacing:.8px;color:#92988c;font-size:10px;padding:12px 13px;border-bottom:1px solid var(--line)}.table td{padding:14px 13px;border-bottom:1px solid #f0f0e8;font-size:12px}.table tr:last-child td{border:0}.table tbody tr:hover{background:#fbfcf6}.primarytext{font-weight:700}.muted{color:var(--muted)}.empty{text-align:center;padding:52px 20px;color:var(--muted)}.settingsgrid{grid-template-columns:1fr 1fr}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;font-weight:700;color:#747b70}.field input,.field select,.field textarea{padding:10px 11px;border:1px solid var(--line);border-radius:9px;outline:none;background:white;color:var(--ink)}.field textarea{min-height:72px;resize:vertical}.field.full{grid-column:1/-1}.settingform{display:flex;flex-direction:column;gap:14px}.modalback{display:none;position:fixed;inset:0;background:#20271e69;z-index:10;align-items:center;justify-content:center;padding:20px}.modalback.open{display:flex}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:18px;padding:24px;box-shadow:0 25px 90px #12190f45}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{font:800 20px Manrope;margin:0}.close{border:0;background:#f1f3e9;border-radius:9px;width:32px;height:32px;font-size:19px}.modalform{display:grid;gap:14px}.items{border:1px solid var(--line);border-radius:11px;overflow:auto}.itemrow{min-width:560px;display:grid;grid-template-columns:2fr .7fr 1fr .7fr 30px;gap:8px;padding:8px;border-bottom:1px solid #f0f0e8;align-items:center}.itemrow.head{font-size:10px;color:#92988c;font-weight:700;text-transform:uppercase}.itemrow input,.itemrow select{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px}.totals{display:flex;justify-content:flex-end}.totalbox{min-width:240px}.totalrow{display:flex;justify-content:space-between;padding:5px 0;color:#737b6e;font-size:12px}.totalrow.big{font-weight:800;color:var(--ink);font-size:15px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:7px}.printdoc{display:none}.reportfilters{display:flex;gap:8px;align-items:center}.reportcards{grid-template-columns:repeat(4,1fr);margin-bottom:18px}.auditline{padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.mobile-nav{display:none}
@media(max-width:1050px){.topbar{padding:0 3%;gap:14px}.brand{min-width:unset}.nav button{padding:9px 8px;font-size:12px}.search input{width:145px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.topbar{height:62px;padding:0 17px;justify-content:space-between}.nav{display:none}.search{display:none}main{padding:25px 16px 92px}.heading{align-items:flex-start;gap:12px;flex-direction:column}.heading h1{font-size:26px}.heading>.actions{width:100%;overflow:auto}.metrics{gap:10px}.metric{padding:15px}.metric .value{font-size:21px}.metric .foot{font-size:10px}.cols,.settingsgrid{grid-template-columns:1fr}.quick{grid-template-columns:1fr}.quick button{display:flex;align-items:center;gap:10px}.quick button b{margin:0 0 3px}.quick .ico{flex:none}.chart{gap:5px}.reportcards{grid-template-columns:repeat(2,1fr)}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fffefa;border-top:1px solid var(--line);z-index:5;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:none;color:#858b80;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}.mobile-nav button.active{color:#31452c;font-weight:700}.mobile-nav span{font-size:18px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{flex-direction:column}.toolbar .filters{flex-wrap:wrap}.actions{flex-wrap:wrap}}
@media print{body{background:white}.topbar,.mobile-nav,.heading .actions,.toolbar,.link,.no-print{display:none!important}main{padding:0;max-width:none}.card{box-shadow:none}.section{display:none!important}.section.show{display:block!important}.heading{margin-bottom:12px}}
</style></head>
<body><div class="app"><header class="topbar"><div class="brand"><div class="logo">✳</div>ledgerly</div><nav class="nav" id="nav"></nav><div class="topright"><label class="search"><span>⌕</span><input id="globalSearch" placeholder="Search anything…"></label><div class="avatar">J</div></div></header><main id="main"></main><nav class="mobile-nav" id="mobileNav"></nav></div><div class="modalback" id="modalback"><section class="modal" id="modal"></section></div>
<script>
const KEY='ledgerly.v1';
const defaults={company:{name:'',address:'',registration:'',vatNumber:'',currency:'USD',terms:14,logo:''},vat:[],clients:[],products:[],quotes:[],invoices:[],payments:[],expenses:[],audit:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{db=structuredClone(defaults)};db.company=db.company||{};db.company.currency='USD';db.company.logo=db.company.logo||'';db.vat=db.vat||[];db.clients=db.clients||[];db.products=db.products||[];db.quotes=db.quotes||[];db.invoices=db.invoices||[];db.payments=db.payments||[];db.expenses=db.expenses||[];db.audit=db.audit||[];
if(!localStorage.getItem('ledgerly.clean-start.v1')){const demoClients=new Set(['c1','c2','c3']),demoInvoices=new Set(['i1','i2','i3']),demoQuotes=new Set(['q1','q2']),demoProducts=new Set(['p1','p2','p3','p4']),demoExpenses=new Set(['e1','e2']);db.clients=db.clients.filter(x=>!demoClients.has(x.id));db.quotes=db.quotes.filter(x=>!demoQuotes.has(x.id));db.invoices=db.invoices.filter(x=>!demoInvoices.has(x.id));db.payments=db.payments.filter(x=>!['pay1','pay2'].includes(x.id)&&!demoInvoices.has(x.invoice));db.products=db.products.filter(x=>!demoProducts.has(x.id));db.expenses=db.expenses.filter(x=>!demoExpenses.has(x.id));if(db.company.name==='Fern & Finch Studio'){db.company.name='';db.company.address='';db.company.registration='';db.company.vatNumber=''}db.audit=[];localStorage.setItem('ledgerly.clean-start.v1','1')}
let page='Overview',filter='';
const navItems=[['Overview','⌂'],['Clients','♙'],['Products','◇'],['Quotes','▤'],['Invoices','▣'],['Payments','↗'],['Expenses','↘'],['Reports','▥'],['Settings','⚙'],['Audit log','◷']];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function id(p){return p+Math.random().toString(36).slice(2,8)}function money(n){if((db.company.currency||'USD')==='USD')return '$'+new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(+n||0);return new Intl.NumberFormat('en-ZA',{style:'currency',currency:db.company.currency,maximumFractionDigits:2}).format(+n||0)}function date(s){return s?new Date(s+'T12:00:00').toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}):'—'}function client(id){return db.clients.find(x=>x.id===id)?.name||'Unknown client'}function audit(action,detail){db.audit.unshift({date:new Date().toISOString(),action,detail});save()}function totals(d){let sub=d.items.reduce((a,x)=>a+(+x.qty||0)*(+x.price||0),0),taxbase=d.items.filter(x=>x.taxable).reduce((a,x)=>a+(+x.qty||0)*(+x.price||0),0);return{sub,vat:taxbase*(+d.vatRate||0)/100,total:sub+taxbase*(+d.vatRate||0)/100}}function paid(inv){return db.payments.filter(p=>p.invoice===inv.id).reduce((a,p)=>a+(+p.amount||0),0)}function due(inv){return totals(inv).total-paid(inv)}function status(inv){if(paid(inv)>=totals(inv).total&&totals(inv).total>0)return'Paid';if(paid(inv)>0)return'Partially Paid';if(inv.status!=='Draft'&&inv.due&&inv.due<new Date().toISOString().slice(0,10))return'Overdue';return inv.status}function badge(s){return `<span class="badge ${s.toLowerCase().replaceAll(' ','')}">${s}</span>`}function monthKey(s){return(s||'').slice(0,7)}function monthSales(m){return db.invoices.filter(x=>monthKey(x.date)===m).reduce((a,x)=>a+totals(x).sub,0)}function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(n){return +(n||0).toFixed(2)}
function setPage(p){page=p;document.querySelectorAll('.nav button,.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function initNav(){let brand=document.querySelector('.brand');brand.innerHTML=`<div class="logo">${db.company.logo?`<img src="${db.company.logo}" alt="Company logo" style="width:100%;height:100%;object-fit:contain;border-radius:10px">`:'✳'}</div>ledgerly`;for(const id of ['nav','mobileNav'])document.getElementById(id).innerHTML=navItems.map(([n,ico])=>`<button data-page="${n}" class="${page===n?'active':''}" onclick="setPage('${n}')"><span>${ico}</span>${id==='mobileNav'?`<small>${n==='Overview'?'Home':n}</small>`:n}</button>`).join('')}
function head(title,sub,actions=''){return `<div class="heading"><div><p class="eyebrow">${page==='Overview'?'Your business at a glance':'Manage your business'}</p><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${actions}</div></div>`}
function cardMetric(label,value,foot,icon){return `<article class="card metric"><div class="label">${label}</div><div class="value">${value}</div><div class="foot">${foot}</div><div class="bubble">${icon}</div></article>`}
function table(headers,rows){return `<div class="card tablewrap"><table class="table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}"><div class="empty">Nothing here yet. Add your first record to get started.</div></td></tr>`}</tbody></table></div>`}
function overview(){let mk=new Date().toISOString().slice(0,7),monthInv=db.invoices.filter(i=>monthKey(i.date)===mk),received=db.payments.filter(p=>monthKey(p.date)===mk).reduce((a,p)=>a+p.amount,0),outstanding=db.invoices.filter(i=>!['Draft'].includes(i.status)).reduce((a,i)=>a+due(i),0),issued=monthInv.length;let months=[];for(let d=new Date();months.length<6;d.setMonth(d.getMonth()-1))months.unshift(d.toISOString().slice(0,7));let vals=months.map(monthSales),max=Math.max(1,...vals);return head('Good morning, John','Here’s what’s happening with your business this month.',`<button class="btn" onclick="openForm('payment')">＋ Record payment</button><button class="btn primary" onclick="openForm('invoice')">＋ New invoice</button>`)+`<div class="grid metrics">${cardMetric('Invoices this month',issued,`${db.invoices.filter(i=>status(i)==='Paid').length} paid overall`,'▣')}${cardMetric('Payments received',money(received),'Payments recorded this month','↗')}${cardMetric('Outstanding balance',money(outstanding),`${db.invoices.filter(i=>due(i)>0&&i.status!=='Draft').length} invoices to follow up`,'◷')}${cardMetric('Quotes awaiting reply',db.quotes.filter(q=>q.status==='Sent').length,'Sent and awaiting a decision','▤')}</div><div class="grid cols"><section class="card panel"><div class="panel-head"><h2>Revenue overview</h2><span class="muted" style="font-size:11px">Invoice revenue · excl. VAT</span></div><div class="chart">${months.map((m,i)=>`<div class="barcol"><div class="bar ${i===5?'current':''}" style="height:${Math.max(4,vals[i]/max*150)}px" title="${money(vals[i])}"></div><label>${new Date(m+'-01T12:00:00').toLocaleDateString('en-ZA',{month:'short'})}</label></div>`).join('')}</div></section><section class="card panel"><div class="panel-head"><h2>Quick actions</h2></div><div class="quick"><button onclick="openForm('quote')"><span class="ico">▤</span><div><b>New quote</b><small>Prepare an estimate</small></div></button><button onclick="openForm('invoice')"><span class="ico">▣</span><div><b>New invoice</b><small>Bill a client</small></div></button><button onclick="openForm('expense')"><span class="ico">↘</span><div><b>Add expense</b><small>Track spending</small></div></button></div></section><section class="card panel"><div class="panel-head"><h2>Recent invoices</h2><button class="link" onclick="setPage('Invoices')">View all →</button></div><div class="activity">${db.invoices.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(i=>`<div class="row"><div class="docicon">▣</div><div class="grow"><b>${i.number} · ${h(client(i.client))}</b><small>Due ${date(i.due)}</small></div><div style="text-align:right">${badge(status(i))}<div class="money" style="margin-top:5px">${money(due(i))}</div></div></div>`).join('')||`<div class="empty">Your invoices will appear here.</div>`}</div></section><section class="card panel"><div class="panel-head"><h2>Recent activity</h2><button class="link" onclick="setPage('Audit log')">Audit log →</button></div><div class="activity">${db.audit.slice(0,4).map(a=>`<div class="row"><div class="docicon">◷</div><div class="grow"><b>${h(a.action)}</b><small>${h(a.detail)}</small></div><small class="muted">${new Date(a.date).toLocaleDateString()}</small></div>`).join('')||'<div class="empty">Activity will appear here.</div>'}</div></section></div>`}
function renderClients(){let rows=db.clients.filter(c=>(c.name+c.email).toLowerCase().includes(filter.toLowerCase())).map(c=>`<tr><td><span class="primarytext">${h(c.name)}</span></td><td>${h(c.email)}</td><td>${h(c.phone||'—')}</td><td>${c.terms} days</td><td>${db.invoices.filter(i=>i.client===c.id).length} invoices</td><td><button class="btn small" onclick="openForm('client','${c.id}')">Edit</button></td></tr>`).join('');return head('Clients','Your customer relationships in one place.',`<button class="btn primary" onclick="openForm('client')">＋ Add client</button>`)+`<div class="grid metrics">${cardMetric('Total clients',db.clients.length,'Active customer records','♙')}${cardMetric('Open balances',money(db.invoices.reduce((a,i)=>a+due(i),0)),'Across all invoices','◷')}${cardMetric('Quotes sent',db.quotes.filter(q=>q.status==='Sent').length,'Awaiting a decision','▤')}${cardMetric('Client payments',db.payments.length,'Payments recorded','↗')}</div><div class="toolbar"><div class="filters"><input placeholder="Search clients…" value="${h(filter)}" oninput="filter=this.value;render()"></div></div>${table(['Client','Email','Phone','Terms','Invoices',''],rows)}`}
function renderProducts(){let rows=db.products.filter(p=>(p.name+p.description).toLowerCase().includes(filter.toLowerCase())).map(p=>`<tr><td><b>${h(p.name)}</b><div class="muted">${h(p.description||'')}</div></td><td>${money(p.price)}</td><td>${p.taxable?'Standard VAT':'No VAT'}</td><td><button class="btn small" onclick="openForm('product','${p.id}')">Edit</button></td></tr>`).join('');return head('Products & services','Your reusable products, services, and standard prices.',`<button class="btn primary" onclick="openForm('product')">＋ Add product</button>`)+`<div class="grid metrics">${cardMetric('Catalogue items',db.products.length,'Products and services','◇')}${cardMetric('Taxable items',db.products.filter(p=>p.taxable).length,'VAT applied at current rate','％')}${cardMetric('Average unit price',money(db.products.length?db.products.reduce((a,p)=>a+p.price,0)/db.products.length:0),'Across your catalogue','↗')}${cardMetric('Current VAT',`${currentVat()}%`,'Applied to taxable items','％')}</div><div class="toolbar"><div class="filters"><input placeholder="Search products…" value="${h(filter)}" oninput="filter=this.value;render()"></div></div>${table(['Product / service','Unit price','Tax treatment',''],rows)}`}
function currentVat(){let today=new Date().toISOString().slice(0,10);return db.vat.filter(x=>x.effective<=today).sort((a,b)=>b.effective.localeCompare(a.effective))[0]?.rate||0}
function renderQuotes(){let rows=db.quotes.filter(q=>(q.number+client(q.client)+q.status).toLowerCase().includes(filter.toLowerCase())).map(q=>`<tr><td><button class="link primarytext" onclick="openForm('quote','${q.id}')">${q.number}</button></td><td>${h(client(q.client))}</td><td>${date(q.date)}</td><td>${date(q.expiry)}</td><td>${money(totals(q).total)}</td><td>${badge(q.status)}</td><td><button class="btn small" onclick="openForm('quote','${q.id}')">Open</button></td></tr>`).join('');return head('Quotes','Create estimates, then convert accepted work to invoices.',`<button class="btn primary" onclick="openForm('quote')">＋ Create quote</button>`)+`<div class="grid metrics">${cardMetric('Total quotes',db.quotes.length,'All time','▤')}${cardMetric('Accepted',db.quotes.filter(q=>q.status==='Accepted').length,'Ready to invoice','✓')}${cardMetric('Awaiting response',db.quotes.filter(q=>q.status==='Sent').length,'Sent to clients','◷')}${cardMetric('Conversion rate',`${db.quotes.length?Math.round(db.quotes.filter(q=>q.status==='Accepted').length/db.quotes.length*100):0}%`,'Accepted of all quotes','↗')}</div><div class="toolbar"><div class="filters"><input placeholder="Search quotes…" value="${h(filter)}" oninput="filter=this.value;render()"><select onchange="filter=this.value==='All'?'':this.value"><option>All</option><option>Draft</option><option>Sent</option><option>Accepted</option><option>Rejected</option></select></div></div>${table(['Quote','Client','Created','Valid until','Total','Status',''],rows)}`}
function renderInvoices(){let rows=db.invoices.filter(i=>(i.number+client(i.client)+status(i)).toLowerCase().includes(filter.toLowerCase())).map(i=>`<tr><td><button class="link primarytext" onclick="openForm('invoice','${i.id}')">${i.number}</button>${i.source?'<div class="muted">Converted from quote</div>':''}</td><td>${h(client(i.client))}</td><td>${date(i.date)}</td><td>${date(i.due)}</td><td>${money(totals(i).total)}</td><td>${money(due(i))}</td><td>${badge(status(i))}</td><td><button class="btn small" onclick="openForm('invoice','${i.id}')">Open</button></td></tr>`).join('');return head('Invoices','Track billing, due dates, and balances across your business.',`<button class="btn" onclick="print()">⎙ Print / PDF</button><button class="btn primary" onclick="openForm('invoice')">＋ New invoice</button>`)+`<div class="grid metrics">${cardMetric('Total invoices',db.invoices.length,'All time','▣')}${cardMetric('Paid',db.invoices.filter(i=>status(i)==='Paid').length,'Fully settled','✓')}${cardMetric('Outstanding',money(db.invoices.reduce((a,i)=>a+due(i),0)),'Balance still due','◷')}${cardMetric('Overdue',db.invoices.filter(i=>status(i)==='Overdue').length,'Needs follow up','!')}</div><div class="toolbar"><div class="filters"><input placeholder="Search invoices…" value="${h(filter)}" oninput="filter=this.value;render()"><select onchange="filter=this.value==='All'?'':this.value"><option>All statuses</option><option>Paid</option><option>Partially Paid</option><option>Overdue</option><option>Sent</option><option>Draft</option></select></div></div>${table(['Invoice','Client','Issued','Due date','Total','Balance','Status',''],rows)}`}
function renderPayments(){let rows=db.payments.slice().sort((a,b)=>b.date.localeCompare(a.date)).filter(p=>(p.reference+client(db.invoices.find(i=>i.id===p.invoice)?.client)+p.method).toLowerCase().includes(filter.toLowerCase())).map(p=>{let inv=db.invoices.find(i=>i.id===p.invoice);return `<tr><td>${date(p.date)}</td><td><b>${inv?.number||'—'}</b><div class="muted">${h(client(inv?.client))}</div></td><td>${h(p.method)}</td><td>${h(p.reference||'—')}</td><td><b>${money(p.amount)}</b></td><td><button class="btn small" onclick="openForm('payment','${p.id}')">Edit</button></td></tr>`}).join('');return head('Payments','A clear history of money received from your clients.',`<button class="btn primary" onclick="openForm('payment')">＋ Record payment</button>`)+`<div class="grid metrics">${cardMetric('Total received',money(db.payments.reduce((a,p)=>a+p.amount,0)),'Across all payments','↗')}${cardMetric('This month',money(db.payments.filter(p=>monthKey(p.date)===new Date().toISOString().slice(0,7)).reduce((a,p)=>a+p.amount,0)),'Payments recorded this month','◷')}${cardMetric('Transactions',db.payments.length,'Payment records','▤')}${cardMetric('Methods used',new Set(db.payments.map(p=>p.method)).size,'Across your payment history','◇')}</div><div class="toolbar"><div class="filters"><input placeholder="Search payments…" value="${h(filter)}" oninput="filter=this.value;render()"></div></div>${table(['Date','Invoice / client','Method','Reference','Amount',''],rows)}`}
function renderExpenses(){let rows=db.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).filter(e=>(e.description+e.category).toLowerCase().includes(filter.toLowerCase())).map(e=>`<tr><td>${date(e.date)}</td><td><b>${h(e.description)}</b></td><td>${h(e.category)}</td><td>${e.taxable?'Yes':'No'}</td><td>${money(e.amount)}</td><td><button class="btn small" onclick="openForm('expense','${e.id}')">Edit</button></td></tr>`).join('');return head('Expenses','Record business spending for a simple profit and loss view.',`<button class="btn primary" onclick="openForm('expense')">＋ Add expense</button>`)+`<div class="grid metrics">${cardMetric('Total expenses',money(db.expenses.reduce((a,e)=>a+e.amount,0)),'Captured expenses','↘')}${cardMetric('This month',money(db.expenses.filter(e=>monthKey(e.date)===new Date().toISOString().slice(0,7)).reduce((a,e)=>a+e.amount,0)),'Expenses recorded this month','◷')}${cardMetric('Expense entries',db.expenses.length,'All time','▤')}${cardMetric('Categories',new Set(db.expenses.map(e=>e.category)).size,'Used to organize spending','◇')}</div><div class="toolbar"><div class="filters"><input placeholder="Search expenses…" value="${h(filter)}" oninput="filter=this.value;render()"></div></div>${table(['Date','Description','Category','VAT recoverable','Amount',''],rows)}`}
function renderReports(){let start=new Date().toISOString().slice(0,7)+'-01',end=new Date().toISOString().slice(0,10),inRange=(d)=>d>=start&&d<=end,ins=db.invoices.filter(i=>inRange(i.date)),sales=ins.reduce((a,i)=>a+totals(i).sub,0),vat=ins.reduce((a,i)=>a+totals(i).vat,0),received=db.payments.filter(p=>inRange(p.date)).reduce((a,p)=>a+p.amount,0),open=db.invoices.filter(i=>due(i)>0&&i.status!=='Draft'),expense=db.expenses.filter(e=>inRange(e.date)).reduce((a,e)=>a+e.amount,0);return head('Reports & analytics','A snapshot of sales, VAT, cash received, and business expenses.',`<button class="btn" onclick="exportCSV()">↓ Export CSV</button><button class="btn" onclick="print()">⎙ Save PDF</button>`)+`<div class="toolbar"><div class="reportfilters"><b>Period</b><input type="date" id="rstart" value="${start}" onchange="render()"><span>to</span><input type="date" id="rend" value="${end}" onchange="render()"><select id="preset" onchange="setReportPeriod(this.value)"><option value="custom">Custom</option><option value="month">This month</option><option value="year">This year</option></select></div></div><div class="grid reportcards">${cardMetric('Sales excl. VAT',money(sales),'Invoices issued in period','↗')}${cardMetric('VAT charged',money(vat),'Based on historical invoice rates','％')}${cardMetric('Payments received',money(received),'Cash recorded in period','✓')}${cardMetric('Outstanding',money(open.reduce((a,i)=>a+due(i),0)),`${open.length} open invoices`,'◷')}</div><div class="grid cols"><section class="card panel"><div class="panel-head"><h2>Profit & loss</h2><small class="muted">Selected period</small></div><div class="totalrow"><span>Invoice revenue (excl. VAT)</span><b>${money(sales)}</b></div><div class="totalrow"><span>Expenses recorded</span><b>− ${money(expense)}</b></div><div class="totalrow big"><span>Net result</span><b>${money(sales-expense)}</b></div><p class="muted" style="font-size:11px;margin-top:14px">This basic view uses invoices issued and manually captured expenses. It does not account for cost of goods, depreciation, or tax.</p></section><section class="card panel"><div class="panel-head"><h2>Monthly trend</h2><small class="muted">Sales excl. VAT</small></div>${(()=>{let months=[];for(let d=new Date();months.length<6;d.setMonth(d.getMonth()-1))months.unshift(d.toISOString().slice(0,7));let max=Math.max(1,...months.map(monthSales));return `<div class="chart">${months.map((m,i)=>`<div class="barcol"><div class="bar ${i===5?'current':''}" style="height:${Math.max(4,monthSales(m)/max*150)}px" title="${money(monthSales(m))}"></div><label>${new Date(m+'-01T12:00:00').toLocaleDateString('en-ZA',{month:'short'})}</label></div>`).join('')}</div>`})()}</section></div><div style="height:16px"></div>${table(['Invoice','Client','Date','Sales excl. VAT','VAT','Total','Status'],ins.map(i=>`<tr><td>${i.number}</td><td>${h(client(i.client))}</td><td>${date(i.date)}</td><td>${money(totals(i).sub)}</td><td>${money(totals(i).vat)}</td><td>${money(totals(i).total)}</td><td>${badge(status(i))}</td></tr>`).join(''))}`}
function renderSettings(){return head('Settings','Company details, currency, and VAT configuration.',`<button class="btn" onclick="exportData()">↓ Export backup</button><button class="btn" onclick="document.getElementById('restoreFile').click()">↑ Restore backup</button><input id="restoreFile" type="file" accept="application/json" hidden onchange="restoreData(this)">`)+`<div class="grid settingsgrid"><section class="card panel"><div class="panel-head"><h2>Company profile</h2></div><div style="display:flex;align-items:center;gap:14px;margin-bottom:18px"><div style="height:64px;width:64px;border:1px solid var(--line);border-radius:13px;background:#f8f9f2;display:grid;place-items:center;overflow:hidden">${db.company.logo?`<img src="${db.company.logo}" style="width:100%;height:100%;object-fit:contain" alt="Company logo preview">`:'<span style="font-size:24px">✳</span>'}</div><div><b style="display:block;margin-bottom:7px">Company logo</b><input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="loadLogo(this)" style="font-size:11px;max-width:225px">${db.company.logo?'<button class="link" type="button" onclick="removeLogo()">Remove logo</button>':''}<div class="muted" style="font-size:10px;margin-top:5px">PNG, JPG, SVG or WebP. Up to 2 MB.</div></div></div><form class="settingform" onsubmit="saveCompany(event)"><div class="formgrid"><div class="field full"><label>Company name</label><input name="name" required value="${h(db.company.name)}"></div><div class="field full"><label>Business address</label><textarea name="address">${h(db.company.address)}</textarea></div><div class="field"><label>Registration number</label><input name="registration" value="${h(db.company.registration)}"></div><div class="field"><label>VAT number</label><input name="vatNumber" value="${h(db.company.vatNumber)}"></div><div class="field"><label>Default currency</label><select name="currency">${[['USD','US Dollar ($)'],['ZAR','South African Rand (R)'],['GBP','British Pound (£)'],['EUR','Euro (€)'],['AUD','Australian Dollar ($)'],['CAD','Canadian Dollar ($)'],['KES','Kenyan Shilling'],['NGN','Nigerian Naira']].map(([c,label])=>`<option value="${c}" ${db.company.currency===c?'selected':''}>${label}</option>`).join('')}</select></div><div class="field"><label>Default payment terms (days)</label><input name="terms" type="number" min="0" value="${db.company.terms||14}"></div></div><button class="btn primary">Save company details</button></form></section><section class="card panel"><div class="panel-head"><h2>VAT rates</h2><button class="btn small" onclick="addVat()">＋ Add rate</button></div><p class="muted" style="font-size:12px">New rates apply to documents created from their effective date. Existing documents keep their original rate.</p>${table(['Rate','Effective from','Label',''],db.vat.slice().sort((a,b)=>b.effective.localeCompare(a.effective)).map((v,i)=>`<tr><td><b>${v.rate}%</b></td><td>${date(v.effective)}</td><td>${h(v.label||'VAT')}</td><td><button class="btn small" onclick="editVat(${i})">Edit</button></td></tr>`).join(''))}<p class="muted" style="font-size:11px;margin-top:14px">Current rate: <b>${currentVat()}%</b></p></section></div><div class="card panel" style="margin-top:16px"><div class="panel-head"><h2>Data storage</h2><span class="badge">This browser</span></div><p class="muted" style="font-size:12px;line-height:1.6">Your records are saved in this browser on this device. Use “Export backup” regularly. For multiple team members to sign in and share live data, this prototype needs a hosted database and authentication service.</p><button class="btn" onclick="if(confirm('Delete all Ledgerly data saved in this browser?')){localStorage.removeItem(KEY);location.reload()}">Reset local data</button></div>`}
function renderAudit(){return head('Audit log','A history of important changes made in this workspace.',`<button class="btn" onclick="exportCSV('audit')">↓ Export CSV</button>`)+`<div class="card panel">${db.audit.length?db.audit.map(a=>`<div class="auditline"><b>${h(a.action)}</b><span class="muted"> · ${h(a.detail)}</span><div class="muted" style="font-size:10px;margin-top:4px">${new Date(a.date).toLocaleString()}</div></div>`).join(''):'<div class="empty">Changes to invoices, payments, VAT, and settings will be listed here.</div>'}</div>`}
function render(){initNav();const el=document.getElementById('main');let html={Overview:overview,Clients:renderClients,Products:renderProducts,Quotes:renderQuotes,Invoices:renderInvoices,Payments:renderPayments,Expenses:renderExpenses,Reports:renderReports,Settings:renderSettings,'Audit log':renderAudit}[page]();el.innerHTML=`<section class="section show">${html}</section>`}
function openForm(type,recordId){let obj=recordId?({client:db.clients,product:db.products,quote:db.quotes,invoice:db.invoices,payment:db.payments,expense:db.expenses}[type]||[]).find(x=>x.id===recordId):null;document.getElementById('modal').innerHTML=({client:()=>clientForm(obj),product:()=>productForm(obj),quote:()=>docForm('quote',obj),invoice:()=>docForm('invoice',obj),payment:()=>paymentForm(obj),expense:()=>expenseForm(obj)})[type]();document.getElementById('modalback').classList.add('open');if(type==='quote'||type==='invoice')calcDoc();}
function field(label,name,val='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${h(val)}" ${extra}></div>`}
function clientForm(o){return `<div class="modalhead"><h2>${o?'Edit client':'Add a client'}</h2><button class="close" onclick="closeModal()">×</button></div><form class="modalform" onsubmit="saveClient(event,'${o?.id||''}')"><div class="formgrid">${field('Client name','name',o?.name||'','text','required')}${field('Email','email',o?.email||'','email')}${field('Phone','phone',o?.phone||'')}${field('Payment terms (days)','terms',o?.terms??db.company.terms,'number','min="0"')}${field('Billing address','address',o?.address||'','text','class="full"')}</div><div class="modalfoot">${o?`<button type="button" class="btn" style="margin-right:auto;color:#a64e3c" onclick="deleteClient('${o.id}')">Delete client</button>`:''}<button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save client</button></div></form>`}
function productForm(o){return `<div class="modalhead"><h2>${o?'Edit product':'Add a product or service'}</h2><button class="close" onclick="closeModal()">×</button></div><form class="modalform" onsubmit="saveProduct(event,'${o?.id||''}')"><div class="formgrid">${field('Name','name',o?.name||'','text','required')}${field('Unit price','price',o?.price||'','number','step="0.01" min="0" required')}<div class="field full"><label>Description</label><input name="description" value="${h(o?.description||'')}"></div><div class="field"><label>VAT treatment</label><select name="taxable"><option value="true" ${o?.taxable!==false?'selected':''}>VAT applicable</option><option value="false" ${o?.taxable===false?'selected':''}>No VAT</option></select></div></div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save product</button></div></form>`}
function docForm(type,o){let isq=type==='quote',arr=o?.items||[],doc=o||{client:'',date:new Date().toISOString().slice(0,10),expiry:'',due:'',items:[],vatRate:currentVat(),status:'Draft'};return `<div class="modalhead"><h2>${o?'Edit':'Create'} ${isq?'quote':'invoice'}</h2><button class="close" onclick="closeModal()">×</button></div><form class="modalform" id="docForm" onsubmit="saveDoc(event,'${type}','${o?.id||''}')"><div class="formgrid"><div class="field"><label>Client</label><select name="client" required><option value="">Select a client…</option>${db.clients.map(c=>`<option value="${c.id}" ${doc.client===c.id?'selected':''}>${h(c.name)}</option>`).join('')}</select></div>${field(isq?'Quote date':'Invoice date','date',doc.date,'date','required')}${isq?field('Valid until','expiry',doc.expiry||new Date(Date.now()+30*86400000).toISOString().slice(0,10),'date'):field('Payment due','due',doc.due||dueDate(doc.client,doc.date),'date')}<div class="field"><label>Status</label><select name="status">${(isq?['Draft','Sent','Accepted','Rejected']:['Draft','Sent']).map(s=>`<option ${doc.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div><div class="panel-head" style="margin:4px 0 9px"><b>Line items</b><button type="button" class="btn small" onclick="addItemRow()">＋ Add line</button></div><div class="items"><div class="itemrow head"><span>Item / description</span><span>Qty</span><span>Unit price</span><span>VAT</span><span></span></div><div id="itemRows">${arr.map(itemRow).join('')}</div></div></div><div class="totals"><div class="totalbox" id="docTotals"></div></div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancel</button>${!isq&&o?`<button type="button" class="btn" onclick="openForm('payment')">＋ Payment</button>`:''}${isq&&o?.status==='Accepted'&&!db.invoices.some(i=>i.source===o.id)?`<button type="button" class="btn dark" onclick="convertQuote('${o.id}')">Convert to invoice →</button>`:''}${o&&!isq?`<button type="button" class="btn" onclick="printDocument('${o.id}')">⎙ PDF / Print</button>`:''}<button class="btn primary">Save ${isq?'quote':'invoice'}</button></div></form>`}
function itemRow(x={name:'',qty:1,price:0,taxable:true}){return `<div class="itemrow"><input class="itemname" list="productList" placeholder="Choose or type an item" value="${h(x.name)}" oninput="itemNameChanged(this)"><datalist id="productList">${db.products.map(p=>`<option value="${h(p.name)}"></option>`).join('')}</datalist><input class="itemqty" type="number" min="0" step="0.01" value="${x.qty}" oninput="calcDoc()"><input class="itemprice" type="number" min="0" step="0.01" value="${x.price}" oninput="calcDoc()"><select class="itemtax" onchange="calcDoc()"><option value="true" ${x.taxable?'selected':''}>${currentVat()}%</option><option value="false" ${!x.taxable?'selected':''}>None</option></select><button type="button" class="close" style="width:26px;height:26px" onclick="this.parentElement.remove();calcDoc()">×</button></div>`}
function addItemRow(){document.getElementById('itemRows').insertAdjacentHTML('beforeend',itemRow());calcDoc()}function itemNameChanged(el){let p=db.products.find(x=>x.name===el.value);if(p){let r=el.closest('.itemrow');r.querySelector('.itemprice').value=p.price;r.querySelector('.itemtax').value=String(p.taxable)}calcDoc()}function calcDoc(){let rows=[...document.querySelectorAll('#itemRows .itemrow')],sub=0,tax=0;for(const r of rows){let n=(+r.querySelector('.itemqty').value||0)*(+r.querySelector('.itemprice').value||0);sub+=n;if(r.querySelector('.itemtax').value==='true')tax+=n*currentVat()/100}document.getElementById('docTotals').innerHTML=`<div class="totalrow"><span>Subtotal</span><b>${money(sub)}</b></div><div class="totalrow"><span>VAT (${currentVat()}%)</span><b>${money(tax)}</b></div><div class="totalrow big"><span>Total</span><b>${money(sub+tax)}</b></div>`}
function dueDate(clientId,dateStr){let c=db.clients.find(c=>c.id===clientId),d=new Date((dateStr||new Date().toISOString().slice(0,10))+'T12:00:00');d.setDate(d.getDate()+(+c?.terms||+db.company.terms||14));return d.toISOString().slice(0,10)}
function paymentForm(o){return `<div class="modalhead"><h2>${o?'Edit':'Record a'} payment</h2><button class="close" onclick="closeModal()">×</button></div><form class="modalform" onsubmit="savePayment(event,'${o?.id||''}')"><div class="formgrid"><div class="field full"><label>Invoice</label><select name="invoice" required><option value="">Select an invoice…</option>${db.invoices.map(i=>`<option value="${i.id}" ${o?.invoice===i.id?'selected':''}>${i.number} · ${h(client(i.client))} · ${money(due(i))} due</option>`).join('')}</select></div>${field('Payment date','date',o?.date||new Date().toISOString().slice(0,10),'date','required')}${field('Amount','amount',o?.amount||'','number','step="0.01" min="0.01" required')}<div class="field"><label>Method</label><select name="method">${['EFT','Cash','Card','Cheque','Other'].map(x=>`<option ${o?.method===x?'selected':''}>${x}</option>`).join('')}</select></div>${field('Reference','reference',o?.reference||'')}</div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save payment</button></div></form>`}
function expenseForm(o){return `<div class="modalhead"><h2>${o?'Edit expense':'Add an expense'}</h2><button class="close" onclick="closeModal()">×</button></div><form class="modalform" onsubmit="saveExpense(event,'${o?.id||''}')"><div class="formgrid">${field('Description','description',o?.description||'','text','required')}${field('Date','date',o?.date||new Date().toISOString().slice(0,10),'date','required')}${field('Amount','amount',o?.amount||'','number','step="0.01" min="0" required')}${field('Category','category',o?.category||'General') }<div class="field"><label>VAT applicable</label><select name="taxable"><option value="false" ${!o?.taxable?'selected':''}>No</option><option value="true" ${o?.taxable?'selected':''}>Yes</option></select></div></div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save expense</button></div></form>`}
function closeModal(){document.getElementById('modalback').classList.remove('open')}document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function formObj(form){return Object.fromEntries(new FormData(form).entries())}function saveClient(e,rid){e.preventDefault();let x=formObj(e.target);x.terms=+x.terms||0;if(rid)Object.assign(db.clients.find(y=>y.id===rid),x);else db.clients.push({id:id('c'),...x});audit(rid?'Client updated':'Client created',x.name);closeModal();render()}
function deleteClient(cid){let c=db.clients.find(x=>x.id===cid);if(!c)return;let invs=db.invoices.filter(x=>x.client===cid),quotes=db.quotes.filter(x=>x.client===cid),invIds=new Set(invs.map(x=>x.id)),pays=db.payments.filter(x=>invIds.has(x.invoice));if(!confirm(`Remove ${c.name}? This will also remove ${invs.length} invoice(s), ${quotes.length} quote(s), and ${pays.length} payment(s) linked to this client.`))return;db.payments=db.payments.filter(x=>!invIds.has(x.invoice));db.invoices=db.invoices.filter(x=>x.client!==cid);db.quotes=db.quotes.filter(x=>x.client!==cid);db.clients=db.clients.filter(x=>x.id!==cid);audit('Client deleted',`${c.name}; ${invs.length} invoices, ${quotes.length} quotes, ${pays.length} payments removed`);closeModal();render()}
function saveProduct(e,rid){e.preventDefault();let x=formObj(e.target);x.price=+x.price;x.taxable=x.taxable==='true';if(rid)Object.assign(db.products.find(y=>y.id===rid),x);else db.products.push({id:id('p'),...x});audit(rid?'Product updated':'Product created',x.name);closeModal();render()}
function saveDoc(e,type,rid){e.preventDefault();let f=e.target,x=formObj(f);x.items=[...f.querySelectorAll('.itemrow:not(.head)')].map(r=>({name:r.querySelector('.itemname').value.trim(),qty:+r.querySelector('.itemqty').value,price:+r.querySelector('.itemprice').value,taxable:r.querySelector('.itemtax').value==='true'})).filter(a=>a.name&&a.qty>0);if(!x.items.length){alert('Add at least one line item.');return}x.vatRate=rid?db[type==='quote'?'quotes':'invoices'].find(d=>d.id===rid).vatRate:currentVat();if(type==='invoice'&&!x.due)x.due=dueDate(x.client,x.date);if(rid){let old=(type==='quote'?db.quotes:db.invoices).find(d=>d.id===rid);Object.assign(old,x);audit(`${type==='quote'?'Quote':'Invoice'} updated`,old.number)}else{x.id=id(type==='quote'?'q':'i');let year=(x.date||'').slice(0,4),seq=(type==='quote'?db.quotes:db.invoices).filter(d=>d.number.includes(year)).length+1;x.number=`${type==='quote'?'Q':'INV'}-${year}-${String(seq).padStart(3,'0')}`;(type==='quote'?db.quotes:db.invoices).unshift(x);audit(`${type==='quote'?'Quote':'Invoice'} created`,x.number)}closeModal();render()}
function convertQuote(qid){let q=db.quotes.find(x=>x.id===qid);if(!q||q.status!=='Accepted')return;let dateNow=new Date().toISOString().slice(0,10),c=db.clients.find(x=>x.id===q.client),year=dateNow.slice(0,4),seq=db.invoices.filter(x=>x.number.includes(year)).length+1,inv={id:id('i'),number:`INV-${year}-${String(seq).padStart(3,'0')}`,client:q.client,date:dateNow,due:dueDate(q.client,dateNow),status:'Draft',source:q.id,items:structuredClone(q.items),vatRate:q.vatRate};db.invoices.unshift(inv);audit('Invoice created from quote',`${q.number} → ${inv.number}`);closeModal();openForm('invoice',inv.id)}
function savePayment(e,rid){e.preventDefault();let x=formObj(e.target);x.amount=+x.amount;if(rid){let old=db.payments.find(p=>p.id===rid);Object.assign(old,x);audit('Payment updated',`${money(x.amount)} · ${x.reference||x.method}`)}else{x.id=id('pay');db.payments.unshift(x);audit('Payment recorded',`${money(x.amount)} · ${x.method} · ${x.reference||'no reference'}`)}closeModal();render()}
function saveExpense(e,rid){e.preventDefault();let x=formObj(e.target);x.amount=+x.amount;x.taxable=x.taxable==='true';if(rid)Object.assign(db.expenses.find(y=>y.id===rid),x);else db.expenses.unshift({id:id('e'),...x});audit(rid?'Expense updated':'Expense recorded',`${x.description} · ${money(x.amount)}`);closeModal();render()}
function saveCompany(e){e.preventDefault();let x=formObj(e.target);x.terms=+x.terms;x.logo=db.company.logo||'';db.company=x;audit('Company settings updated',x.name);render()}
function loadLogo(input){let file=input.files?.[0];if(!file)return;if(file.size>2*1024*1024){alert('Choose an image smaller than 2 MB.');input.value='';return}let reader=new FileReader();reader.onload=()=>{db.company.logo=reader.result;save();audit('Company logo updated',file.name);render()};reader.readAsDataURL(file)}function removeLogo(){db.company.logo='';save();audit('Company logo removed',db.company.name);render()}
function addVat(){let rate=prompt('New VAT rate percentage (e.g. 15):',currentVat());if(rate===null)return;let effective=prompt('Effective date (YYYY-MM-DD):',new Date().toISOString().slice(0,10));if(!effective)return;db.vat.push({rate:+rate,effective,label:'VAT'});audit('VAT rate added',`${rate}% effective ${effective}`);render()}
function editVat(i){let v=db.vat.slice().sort((a,b)=>b.effective.localeCompare(a.effective))[i];if(!v)return;let rate=prompt('VAT rate percentage:',v.rate);if(rate===null)return;let effective=prompt('Effective date (YYYY-MM-DD):',v.effective);if(effective===null)return;let actual=db.vat.find(x=>x===v);actual.rate=+rate;actual.effective=effective;audit('VAT rate changed',`${rate}% effective ${effective}`);render()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ledgerly-backup.json';a.click();URL.revokeObjectURL(a.href)}function restoreData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.company||!x.invoices)throw 0;db=x;save();audit('Data restored','Backup file imported');render()}catch{alert('This does not look like a Ledgerly backup.')}};r.readAsText(f)}
function exportCSV(which){let rows=which==='audit'?[['Date','Action','Details'],...db.audit.map(a=>[a.date,a.action,a.detail])]:[['Number','Client','Date','Due','Subtotal excl VAT','VAT','Total','Paid','Balance','Status'],...db.invoices.map(i=>[i.number,client(i.client),i.date,i.due,totals(i).sub,totals(i).vat,totals(i).total,paid(i),due(i),status(i)])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=which==='audit'?'ledgerly-audit.csv':'ledgerly-invoices.csv';a.click();URL.revokeObjectURL(a.href)}
function printDocument(iid){let i=db.invoices.find(x=>x.id===iid);if(!i)return;let t=totals(i),html=`<html><head><title>${i.number}</title><style>body{font:14px Arial;color:#20271e;padding:48px}h1{font-size:30px}.top{display:flex;justify-content:space-between}.meta{color:#66705f;line-height:1.8}table{width:100%;border-collapse:collapse;margin-top:36px}th,td{text-align:left;padding:13px;border-bottom:1px solid #ddd}th{font-size:11px;text-transform:uppercase;color:#66705f}.total{text-align:right;margin-top:20px;line-height:2}.grand{font-size:20px;font-weight:bold;border-top:1px solid #ddd;padding-top:8px}</style></head><body><div class="top"><div><h1>INVOICE</h1><b>${i.number}</b><div class="meta">Issue date: ${date(i.date)}<br>Due date: ${date(i.due)}</div></div><div style="text-align:right">${db.company.logo?`<img src="${db.company.logo}" alt="Company logo" style="max-width:150px;max-height:75px;object-fit:contain">`:''}<h2>${h(db.company.name)}</h2><div class="meta">${h(db.company.address)}<br>Registration: ${h(db.company.registration)}<br>VAT: ${h(db.company.vatNumber)}</div></div></div><h3>Bill to<br>${h(client(i.client))}</h3><div class="meta">${h(db.clients.find(c=>c.id===i.client)?.address||'')}</div><table><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>VAT</th><th>Line total</th></tr></thead><tbody>${i.items.map(x=>`<tr><td>${h(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${x.taxable?i.vatRate+'%':'—'}</td><td>${money(x.qty*x.price*(1+(x.taxable?i.vatRate/100:0)))}</td></tr>`).join('')}</tbody></table><div class="total">Subtotal: ${money(t.sub)}<br>VAT: ${money(t.vat)}<div class="grand">Total: ${money(t.total)}</div><div>Paid: ${money(paid(i))} · Balance: ${money(due(i))}</div></div><p class="meta" style="margin-top:60px">Thank you for your business.</p><script>window.onload=()=>window.print()<\/script></body></html>`;let w=window.open('','_blank');w.document.write(html);w.document.close()}
function setReportPeriod(v){let s=document.getElementById('rstart'),e=document.getElementById('rend'),n=new Date();if(v==='month'){s.value=new Date(n.getFullYear(),n.getMonth(),1).toISOString().slice(0,10);e.value=n.toISOString().slice(0,10)}if(v==='year'){s.value=new Date(n.getFullYear(),0,1).toISOString().slice(0,10);e.value=n.toISOString().slice(0,10)}render()}
document.getElementById('globalSearch').addEventListener('input',e=>{filter=e.target.value;if(['Clients','Products','Quotes','Invoices','Payments','Expenses'].includes(page))render()});
